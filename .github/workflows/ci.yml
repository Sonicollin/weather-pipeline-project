name: CI

on:
    push:
        branches: [main]

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Build Docker image
              run: docker build -t weather_pipeline ./weather_pipeline_project

            - name: Run pipeline and dbt tests
              run: docker run --rm weather_pipeline